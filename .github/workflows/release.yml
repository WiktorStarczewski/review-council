name: release
on:
  push:
    tags: ['review-council--v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^review-council--v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing tag '$TAG': expected review-council--vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${TAG#review-council--v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no non-empty '## $VERSION' section: the release was cut without a changelog entry." >&2
            exit 1
          fi

          HIGHEST="$(git tag -l 'review-council--v*' | grep -E '^review-council--v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ "$HIGHEST" == "$TAG" ]]; then
            LATEST=--latest
          else
            LATEST=--latest=false
          fi
          gh release create "$TAG" --verify-tag "$LATEST" \
            --title "review-council $VERSION" --notes-file notes.md
