name: Profiler malformed manifest focused proof
on:
  push:
    branches: [ci/profile-malformed-green]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD^)" = 1ef890d2020beaae60304e153d805d5fe6c4c22f
      - run: bash plugins/review-council/tests/run-tests.sh profile
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind source and mutation script
        run: |
          test "$(git rev-parse HEAD^)" = 1ef890d2020beaae60304e153d805d5fe6c4c22f
          git checkout --detach 1ef890d2020beaae60304e153d805d5fe6c4c22f
          test "$(git rev-parse HEAD^{tree})" = 7607bed8e33fa68a00a35b1effc51d22402fc565
          cp plugins/review-council/scripts/rev-mutate.sh "$RUNNER_TEMP/rev-mutate.sh"
          echo '32bf2e9ca9c676dac2916f9bf3acc1c048e5fa76060178a6cb65fd61ee045bfc  '"$RUNNER_TEMP/rev-mutate.sh" | sha256sum -c -
      - name: Measure corrected hunks
        shell: bash
        run: |
          set -euo pipefail
          git reset --mixed HEAD^
          git diff --full-index --binary > "$RUNNER_TEMP/candidate.patch"
          echo 'a975630a4bbde6a6cc3c3014a887596593288fb4dc957ae55fdf3571894d089c  '"$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/session" proof
          printf "REV_ROOT='%s'\n" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/session/scope.env"
          printf '{"phase":"fix"}\n' > "$RUNNER_TEMP/session/state.json"
          bash "$RUNNER_TEMP/rev-mutate.sh" "$RUNNER_TEMP/session" 'bash plugins/review-council/tests/run-tests.sh profile_source_context_activity' 2>&1 | tee proof/mutation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-malformed-mutation
          path: proof/
          if-no-files-found: warn
