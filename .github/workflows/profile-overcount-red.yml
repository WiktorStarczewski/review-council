name: Profiler packet count expected red
on:
  push:
    branches: [ci/profile-overcount-red]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD^)" = 8a8b1f36b5c89cb777927e98c33b294ad5433923
      - name: Verify intended functional failures
        shell: bash
        run: |
          set +e
          bash plugins/review-council/tests/run-tests.sh profile_source_context_activity > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'FAIL profile rejects an unbound packet_ranges surplus' result.log || exit 1
          grep -F 'FAIL profile rejects packet_ranges above the opened shard total' result.log || exit 1
          grep -F 'FAIL profile rejects packet_ranges below the opened shard total' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-overcount-red
          path: result.log
