name: Profiler integrity corrected proof
on:
  push:
    branches: [ci/profile-integrity-v2]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: test "$(git rev-parse HEAD^)" = 49d56722dd49533be59ade6ee7e17f60262c661e
      - run: bash plugins/review-council/tests/run-tests.sh profile
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind source and mutation script
        run: |
          test "$(git rev-parse HEAD^)" = 49d56722dd49533be59ade6ee7e17f60262c661e
          git checkout --detach 49d56722dd49533be59ade6ee7e17f60262c661e
          test "$(git rev-parse HEAD^{tree})" = 4786c6ff8b528a4f25893e92486481c05a99d4a3
          cp plugins/review-council/scripts/rev-mutate.sh "$RUNNER_TEMP/rev-mutate.sh"
          echo '32bf2e9ca9c676dac2916f9bf3acc1c048e5fa76060178a6cb65fd61ee045bfc  '"$RUNNER_TEMP/rev-mutate.sh" | sha256sum -c -
      - name: Measure corrected hunks
        shell: bash
        run: |
          set -euo pipefail
          git reset --mixed HEAD^
          git diff --full-index --binary > "$RUNNER_TEMP/candidate.patch"
          echo 'f634034d012d5d494c9500cbc51078633f1712b7803c675e7771fb71b8e3141f  '"$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/session" proof
          printf "REV_ROOT='%s'\n" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/session/scope.env"
          printf '{"phase":"fix"}\n' > "$RUNNER_TEMP/session/state.json"
          bash "$RUNNER_TEMP/rev-mutate.sh" "$RUNNER_TEMP/session" 'bash plugins/review-council/tests/run-tests.sh profile_source_context_activity' 2>&1 | tee proof/mutation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-integrity-mutation
          path: proof/
          if-no-files-found: warn
