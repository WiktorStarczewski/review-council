name: Exit 4 frozen policy expected red
on:
  push:
    branches: [ci/exit4-manifest-proof-423a8d2]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout --detach 250c9876414945115e6ffb14ff6369ecf523f9b1 && test "$(git rev-parse HEAD)" = 250c9876414945115e6ffb14ff6369ecf523f9b1
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Verify intended functional regression
        shell: bash
        run: |
          set +e
          bash plugins/review-council/tests/run-tests.sh evidence_hardening_replacement > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'FAIL post_prepare_manifest_policy_cannot_authorize_exit4 exit-4 replacement stays unauthorized' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit4-sidecar-red
          path: result.log
