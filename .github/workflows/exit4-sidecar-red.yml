name: Exit 4 frozen policy expected red
on:
  push:
    branches: [ci/exit4-manifest-proof-423a8d2]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout --detach 423a8d20756e61d4318f66eadcd39ed9030d062c && test "$(git rev-parse HEAD)" = 423a8d20756e61d4318f66eadcd39ed9030d062c
      - name: Verify intended functional regression
        shell: bash
        run: |
          set +e
          REV_EVIDENCE_CASE=post_prepare_manifest_policy_cannot_authorize_exit4 bash plugins/review-council/tests/run-tests.sh evidence_hardening > result.log 2>&1
          status=$?
          cat result.log
          test "$status" -ne 0 || exit 1
          grep -F 'post_prepare_manifest_policy_cannot_authorize_exit4' result.log || exit 1
          grep -F 'exit-4 replacement stays unauthorized' result.log || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit4-sidecar-red
          path: result.log
