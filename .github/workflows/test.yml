name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  proof-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Semantic result rejection regressions
        run: bash plugins/review-council/tests/run-tests.sh evidence_semantic_rejection
      - name: Prepared evidence read regressions
        run: bash plugins/review-council/tests/run-tests.sh prepared_evidence
      - name: Rust import proof regressions
        run: python3 -m unittest discover -s tests -p test_rust_import_resolution.py -v
      - name: Complete code source proof regressions
        if: always()
        run: python3 -m unittest discover -s tests -p test_code_source_promotion.py -v
      - name: Search pipeline bound regressions
        if: always()
        run: python3 -m unittest discover -s tests -p test_search_pipeline_bounds.py -v
      - name: Import source identity regressions
        if: always()
        run: python3 -m unittest discover -s tests -p test_import_source_roots.py -v
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          else
            brew install ripgrep
          fi
      - run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Verify release tree
        run: python3 scripts/verify-review-council.py
      - name: Show failed verifier logs
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import stat

          root = Path.home() / ".cache/review-council/verification"
          diagnostics = Path(os.environ["RUNNER_TEMP"]) / "council-verifier-diagnostics"
          diagnostics.mkdir(parents=True, exist_ok=True)
          sources = sorted(root.glob("*/logs/*.log")) + sorted(root.glob("*/receipt.json"))
          copied_bytes = 0
          if len(sources) > 128:
              print("diagnostic file limit reached; some verifier logs were not copied")
          for path in sources[:128]:
              relative = path.relative_to(root)
              metadata = path.lstat()
              if (any((root / Path(*relative.parts[:end])).is_symlink()
                      for end in range(1, len(relative.parts) + 1))
                      or not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1):
                  print("skipping redirected diagnostic: " + str(relative))
                  continue
              if metadata.st_size > 64 * 1024 * 1024 or copied_bytes + metadata.st_size > 256 * 1024 * 1024:
                  print("diagnostic byte limit reached; not copying " + str(relative))
                  continue
              target = diagnostics / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
              copied_bytes += metadata.st_size
          for path in sorted(root.glob("*/logs/*.log")):
              text = path.read_text(errors="replace")
              lines = text.splitlines()
              try:
                  result = json.loads(lines[-1])
              except (IndexError, json.JSONDecodeError):
                  result = {}
              if result.get("exit_code") != 0:
                  print("failed verifier log: " + path.name)
                  failures = [i for i, line in enumerate(lines)
                              if line.lstrip().startswith(("FAIL", "ERROR:", "Traceback"))]
                  for i in failures[:10]:
                      print("failure context at log line " + str(i + 1))
                      print("\n".join(lines[max(0, i - 2):i + 9])[:2000])
                  if len(failures) > 10:
                      print(str(len(failures) - 10) + " additional failure contexts omitted")
                  print(text[-20000:])
          PY
      - name: Upload failed verifier diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: council-verifier-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/council-verifier-diagnostics
          if-no-files-found: warn
          retention-days: 7
